<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>03 / animal of the week</title>
<link rel="stylesheet" href="_brand.css">
<style>
  .post { padding: 60px; }
  .stage { display: flex; gap: 44px; align-items: center; height: 780px; }
  .photo { width: 520px; transform: rotate(-2deg); }
  .photo img { height: 560px; }
  .info { flex: 1; }
  .name { font-size: 120px; line-height: 0.9; }
  .name img { height: 64px; vertical-align: -6px; }
  .facts { margin-top: 30px; display: grid; gap: 14px; }
  .fact { display: flex; gap: 14px; align-items: center; background: #fff; border-radius: 999px; padding: 14px 26px; box-shadow: 0 8px 20px rgba(11,11,12,0.07); font: 700 25px "Nunito", sans-serif; width: fit-content; }
  .dot { width: 16px; height: 16px; border-radius: 999px; background: var(--amber); flex: none; }
  .fact:nth-child(2) .dot { background: var(--turf); }
  .fact:nth-child(3) .dot { background: var(--collar); }
</style>
</head>
<body>
<div class="post fur">
  <span class="label smoke">Window shelf · animal of the week</span>
  <div class="stage">
    <div class="photo">
      <img src="../website/public/images/pets/kitten-1.jpg" alt="Cream Persian kitten">
    </div>
    <div class="info">
      <h1 class="display name">Simba</h1>
      <svg width="150" height="34" viewBox="0 0 100 40" preserveAspectRatio="none" style="display:block;margin-top:2px"><path d="M2 10 C 30 2 66 34 98 8" fill="none" stroke="var(--amber)" stroke-width="8" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
      <div class="facts">
        <div class="fact"><span class="dot"></span> Cream Persian, 4 months, male</div>
        <div class="fact"><span class="dot"></span> Vaccine card and deworming done</div>
        <div class="fact"><span class="dot"></span> Purrs before he opens his eyes</div>
      </div>
      <p style="margin-top:28px;font:600 24px/1.6 'Nunito',sans-serif;color:var(--smoke);max-width:420px">
        Not shipped, not listed with a price. Come hold him and you will know.
      </p>
    </div>
  </div>

  <div class="footerlock light-foot">
    <div class="mark">
      <img src="../website/public/brand/logo-mark.svg" alt="">
      <span class="wordmark">Happy <img src="../website/public/brand/script-tails.svg" alt="Tails"></span>
    </div>
    <div class="contact">0313 1495287<br>OPEN 24 HOURS</div>
  </div>
</div>
<p class="hint">03 / animal of the week / export 1080x1080</p>
</body>
</html>
