<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>07 / adoption day</title>
<link rel="stylesheet" href="_brand.css">
<style>
  .post { padding: 60px; text-align: center; }
  h1 { font-size: 110px; margin-top: 10px; }
  h1 .script { height: 60px; vertical-align: -4px; }
  .sub { font: 600 26px/1.5 "Nunito", sans-serif; color: var(--smoke); max-width: 700px; margin: 14px auto 0; }
  .strip { display: flex; gap: 22px; justify-content: center; margin-top: 36px; }
  .strip .photo { width: 300px; }
  .strip .photo:nth-child(1) { transform: rotate(-3deg); }
  .strip .photo:nth-child(2) { transform: rotate(2deg) translateY(14px); }
  .strip .photo:nth-child(3) { transform: rotate(-1deg); }
  .strip img { height: 300px; }
  .when { margin-top: 40px; display: flex; gap: 16px; justify-content: center; }
</style>
</head>
<body>
<div class="post fur">
  <span class="label smoke">This saturday · all day</span>
  <h1 class="display">Adoption day.</h1>
  <svg class="swiggle" width="220" height="38" viewBox="0 0 100 40" preserveAspectRatio="none" style="margin:6px auto 0"><path d="M2 10 C 30 2 66 34 98 8" fill="none" stroke="var(--amber)" stroke-width="8" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
  <p class="sub">Every animal leaves with a vaccine card, a deworming record, and our
  number for the rest of its life.</p>

  <div class="strip">
    <div class="photo"><img src="../website/public/images/pets/kitten-1.jpg" alt=""></div>
    <div class="photo"><img src="../website/public/images/pets/puppy-1.jpg" alt=""></div>
    <div class="photo"><img src="../website/public/images/pets/kitten-2.jpg" alt=""></div>
  </div>

  <div class="when">
    <span class="chip turf">Walk in, any hour</span>
    <span class="chip">Ramna Plaza, G-10</span>
    <span class="chip amber">No fee to visit</span>
  </div>

  <div class="footerlock light-foot">
    <div class="mark">
      <img src="../website/public/brand/logo-mark.svg" alt="">
      <span class="wordmark">Happy <img src="../website/public/brand/script-tails.svg" alt="Tails"></span>
    </div>
    <div class="contact">0313 1495287</div>
  </div>
</div>
<p class="hint">07 / adoption day / export 1080x1080</p>
</body>
</html>
