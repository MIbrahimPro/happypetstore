<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>10 / toys under a thousand</title>
<link rel="stylesheet" href="_brand.css">
<style>
  .post { background: var(--amber); padding: 60px; }
  .post::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(to top, rgba(11,11,12,.9), transparent); }
  h1 { font-size: 120px; line-height: .92; }
  h1 small { display: block; font-size: 54px; }
  .grid { display: flex; gap: 22px; margin-top: 44px; }
  .tile { flex: 1; background: var(--bone); border-radius: 30px; padding: 18px; box-shadow: 0 16px 34px rgba(11,11,12,.22); }
  .tile img { height: 250px; border-radius: 20px; }
  .tile .n { font: 800 27px "Baloo 2", sans-serif; margin-top: 14px; }
  .tile .p { font: 800 30px "Baloo 2", sans-serif; color: var(--collar); margin: 4px 0 16px; }
</style>
</head>
<body>
<div class="post">
  <span class="label" style="color:rgba(11,11,12,.65)">Toys that survive the sofa</span>
  <h1 class="display">Everything here<br>under Rs 1,000.<small>Pick three, the third is luck.</small></h1>

  <div class="grid">
    <div class="tile"><img src="../website/public/images/toys/dog-toy-1.jpg" alt=""><div class="n">Rope tug</div><div class="p">Rs 450</div></div>
    <div class="tile"><img src="../website/public/images/toys/cat-toy-1.jpg" alt=""><div class="n">Catnip mouse x2</div><div class="p">Rs 350</div></div>
    <div class="tile"><img src="../website/public/images/toys/cat-toy-2.jpg" alt=""><div class="n">Teaser wand</div><div class="p">Rs 600</div></div>
  </div>

  <div class="footerlock">
    <div class="mark">
      <img src="../website/public/brand/logo-mark.svg" alt="">
      <span class="wordmark">Happy <img src="../website/public/brand/script-tails.svg" alt="Tails"></span>
    </div>
    <div class="contact">G-10 MARKAZ · OPEN NOW</div>
  </div>
</div>
<p class="hint">10 / toys under a thousand / export 1080x1080</p>
</body>
</html>
