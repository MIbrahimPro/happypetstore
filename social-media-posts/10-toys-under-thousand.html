<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>10 / Toys under a thousand</title>
<link rel="stylesheet" href="_brand.css">
<style>
  .post { padding: 60px 56px; background: var(--mustard); }
  .post::after { content: ""; position: absolute; inset: 26px; border: 5px dashed var(--ink); pointer-events: none; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; margin-top: 40px; }
  .toy { background: var(--paper); border: 5px solid var(--ink); box-shadow: 10px 10px 0 rgba(29,27,22,0.85); }
  .toy img { width: 100%; height: 300px; object-fit: cover; border-bottom: 5px solid var(--ink); display: block; }
  .toy .in { padding: 20px 22px 24px; }
  .toy .nm { font: 700 30px "Archivo Black", "Arial Black", sans-serif; }
  .toy .pr { margin-top: 8px; font: 700 30px "Courier New", monospace; color: var(--red-dark); }
  .toy:nth-child(1) { transform: rotate(-1.6deg); }
  .toy:nth-child(2) { transform: rotate(1.2deg) translateY(10px); }
  .toy:nth-child(3) { transform: rotate(-0.8deg); }
  .banner { position: absolute; left: 56px; right: 56px; top: 830px; background: var(--ink); color: var(--paper); text-align: center; padding: 22px; font: 700 32px "Courier New", monospace; letter-spacing: 0.16em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="post">
  <span class="tag red">Toy aisle / restocked</span>
  <h1 class="display" style="font-size:92px; margin-top:22px">EVERY TOY HERE<br>IS UNDER <span style="color:var(--red-dark)">RS 1,000.</span></h1>

  <div class="grid3">
    <div class="toy">
      <img src="../website/public/images/toys/dog-toy-1.jpg" alt="">
      <div class="in"><p class="nm">Rope tug</p><p class="pr">RS 550</p></div>
    </div>
    <div class="toy">
      <img src="../website/public/images/toys/cat-toy-1.jpg" alt="">
      <div class="in"><p class="nm">Jingle balls x4</p><p class="pr">RS 400</p></div>
    </div>
    <div class="toy">
      <img src="../website/public/images/toys/cat-toy-2.jpg" alt="">
      <div class="in"><p class="nm">Feather wand</p><p class="pr">RS 450</p></div>
    </div>
  </div>

  <div class="banner">Cheaper than a new sofa / just saying</div>

  <div class="footerlock" style="background:var(--mustard); border-top-color:var(--ink)">
    <div class="mark">
      <svg viewBox="0 0 64 64" width="52" height="52"><rect width="64" height="64" fill="#D6342C"/><path d="M14 44 C10 34 16 24 26 24 C32 24 36 28 36 34 C36 39 32 42 28 42" fill="none" stroke="#F5EFDF" stroke-width="5" stroke-linecap="round"/><path d="M36 18 L42 12 L44 20 C52 22 54 30 50 36 L52 44 C44 50 34 48 30 40 C26 32 30 22 36 18 Z" fill="#F5EFDF"/><circle cx="41" cy="30" r="2.6" fill="#1D1B16"/></svg>
      <span class="wordmark">HAPPY<span style="color:var(--red)">TAILS</span></span>
    </div>
    <div class="contact">TOY AISLE, SHELF 05<br>G-10 MARKAZ</div>
  </div>
</div>
<p class="hint">10 / toys under a thousand / swap three toys monthly / export 1080x1080</p>
</body>
</html>
