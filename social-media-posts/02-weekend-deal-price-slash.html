<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>02 / Weekend price slash</title>
<link rel="stylesheet" href="_brand.css">
<style>
  .post { background: var(--ink); color: var(--paper); padding: 60px; }
  .slash {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(115deg, transparent 0 46%, var(--red) 46% 54%, transparent 54% 62%, var(--mustard) 62% 65%, transparent 65%);
    opacity: 0.14;
  }
  .band { position: absolute; left: -40px; top: 96px; transform: rotate(-6deg); background: var(--red); color: var(--paper); font: 700 30px "Courier New", monospace; letter-spacing: 0.3em; padding: 16px 60px; text-transform: uppercase; box-shadow: 10px 10px 0 rgba(245,239,223,0.15); }
  .deal { position: absolute; top: 300px; left: 60px; right: 60px; }
  .was { text-decoration: line-through; color: rgba(245,239,223,0.55); font: 700 54px "Courier New", monospace; }
  .now { font-size: 300px; color: var(--mustard); }
  .item { font-size: 64px; }
  .terms { position: absolute; left: 60px; bottom: 150px; right: 60px; font: 20px/1.7 "Courier New", monospace; letter-spacing: 0.12em; color: rgba(245,239,223,0.75); text-transform: uppercase; }
  .footerlock { border-top-color: var(--mustard); }
  .footerlock .wordmark { color: var(--paper); }
</style>
</head>
<body>
<div class="post">
  <div class="slash"></div>
  <span class="band">Weekend only / Fri to Sun</span>

  <div class="deal">
    <p class="mono" style="font-size:26px; color:var(--mustard)">Top load pet carrier</p>
    <p class="item display" style="margin-top:16px">HARD-SHELL CARRIER,<br>UP TO 6 KG.</p>
    <p style="margin-top:26px"><span class="was">Rs 3,900</span></p>
    <p class="now display">RS 3,400</p>
  </div>

  <p class="terms">Cash on delivery inside G-10 / call to reserve, we hold for 24 hours</p>

  <div class="footerlock" style="background:var(--ink)">
    <div class="mark">
      <svg viewBox="0 0 64 64" width="52" height="52"><rect width="64" height="64" fill="#D6342C"/><path d="M14 44 C10 34 16 24 26 24 C32 24 36 28 36 34 C36 39 32 42 28 42" fill="none" stroke="#F5EFDF" stroke-width="5" stroke-linecap="round"/><path d="M36 18 L42 12 L44 20 C52 22 54 30 50 36 L52 44 C44 50 34 48 30 40 C26 32 30 22 36 18 Z" fill="#F5EFDF"/><circle cx="41" cy="30" r="2.6" fill="#1D1B16"/></svg>
      <span class="wordmark">HAPPY<span style="color:var(--red)">TAILS</span></span>
    </div>
    <div class="contact" style="color:var(--paper)">0313 1495287<br>WHATSAPP THE SAME NUMBER</div>
  </div>
</div>
<p class="hint">02 / weekend price slash / export at 1080x1080</p>
</body>
</html>
