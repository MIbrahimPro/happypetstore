<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>02 / weekend deal</title>
<link rel="stylesheet" href="_brand.css">
<style>
  .post { background: var(--night); color: var(--bone); padding: 70px 60px 150px; }
  .kicker { color: var(--amber); }
  .deal { margin-top: 26px; font-size: 100px; }
  .strike { position: relative; color: var(--smoke); }
  .strike:after { content: ""; position: absolute; left: -6px; right: -6px; top: 54%; height: 8px; background: var(--collar); border-radius: 6px; transform: rotate(-4deg); }
  .now { color: var(--amber); }
  .photo { position: absolute; right: -70px; top: 380px; width: 520px; transform: rotate(-4deg); }
  .photo img { height: 480px; }
  .terms { position: absolute; left: 60px; top: 640px; font: 600 22px/1.7 "Nunito", sans-serif; color: rgba(250,246,238,.75); max-width: 420px; }
  .terms b { color: var(--amber); }
</style>
</head>
<body>
<div class="post fur-dark">
  <span class="label kicker">Weekend only · Sat and Sun</span>
  <h1 class="display deal">Kitten starter kits<br><span class="strike">Rs 9,800</span><br><span class="now">Rs 7,900</span></h1>
  <svg class="swiggle" width="260" height="42" viewBox="0 0 100 40" preserveAspectRatio="none" style="margin-top:8px"><path d="M2 12 C 34 2 58 36 98 6" fill="none" stroke="var(--amber)" stroke-width="8" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>

  <div class="terms">
    <b>In the kit:</b> 1.5 kg kitten food, litter tray, two bowls, a teaser wand,
    and the first vaccine check on us. Say "weekend kit" at the counter.
  </div>

  <div class="photo">
    <img src="../website/public/images/pets/kitten-1.jpg" alt="Kitten">
  </div>

  <div class="footerlock">
    <div class="mark">
      <img src="../website/public/brand/logo-mark.svg" alt="">
      <span class="wordmark">Happy <img src="../website/public/brand/script-tails.svg" alt="Tails"></span>
    </div>
    <div class="contact">0313 1495287<br>RAMNA PLAZA, G-10</div>
  </div>
</div>
<p class="hint">02 / weekend deal / export 1080x1080</p>
</body>
</html>
