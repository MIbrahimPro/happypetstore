<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>12 / behind the counter</title>
<link rel="stylesheet" href="_brand.css">
<style>
  .bleed { position: absolute; inset: 0; }
  .bleed img { width: 100%; height: 100%; object-fit: cover; }
  .bleed:after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(11,11,12,.55), rgba(11,11,12,.05) 55%); }
  .card {
    position: absolute; left: 60px; right: 420px; bottom: 170px;
    background: var(--night); color: var(--bone); border-radius: 32px; padding: 38px 42px;
    box-shadow: 0 24px 50px rgba(11,11,12,.4);
  }
  .card h1 { font-size: 66px; }
  .card p { font: 600 24px/1.6 "Nunito", sans-serif; color: rgba(250,246,238,.8); margin-top: 12px; }
  .stamp { position: absolute; right: 64px; bottom: 190px; width: 260px; transform: rotate(6deg); }
</style>
</head>
<body>
<div class="post">
  <div class="bleed"><img src="../website/public/images/shop/clinic-counter.jpg" alt="Counter"></div>

  <div class="card">
    <span class="label" style="color:var(--amber)">Behind the counter</span>
    <h1 class="display">Stock counted twice a day, prices written in pencil we never need to erase.</h1>
    <p>The shelf you see on the website is the shelf on the wall. When it says two left, it means two left.</p>
  </div>

  <img class="stamp" src="../website/public/brand/cat-silhouette.svg" alt="" style="filter:invert(1) opacity(.9)">

  <div class="footerlock">
    <div class="mark">
      <img src="../website/public/brand/logo-mark.svg" alt="">
      <span class="wordmark">Happy <img src="../website/public/brand/script-tails.svg" alt="Tails"></span>
    </div>
    <div class="contact">RAMNA PLAZA · G-10 MARKAZ</div>
  </div>
</div>
<p class="hint">12 / behind the counter / export 1080x1080</p>
</body>
</html>
