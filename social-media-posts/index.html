<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Happy Tails · social templates · soft system</title>
<style>
  :root { --night:#0B0B0C; --bone:#FAF6EE; --smoke:#8A8378; --amber:#F2A83B; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #171616; color: var(--bone); font-family: "Segoe UI", sans-serif; padding: 40px; }
  h1 { font-size: 28px; }
  h1 span { color: var(--amber); }
  p { color: var(--smoke); margin-top: 6px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; margin-top: 30px; }
  figure { background: #201f1f; border-radius: 20px; padding: 14px; }
  .frame { position: relative; width: 100%; aspect-ratio: 1; overflow: hidden; border-radius: 12px; background: var(--bone); }
  .frame iframe { width: 1080px; height: 1080px; border: 0; transform-origin: top left; position: absolute; pointer-events: none; }
  figcaption { font-size: 13px; color: var(--smoke); margin-top: 10px; padding: 0 4px; }
  figcaption b { color: var(--bone); }
</style>
</head>
<body>
  <h1>Happy Tails <span>·</span> fifteen social templates, soft system</h1>
  <p>Each renders at 1080 by 1080. Open an individual file to edit and export. Photos point into ../website/public/images/.</p>
  <div class="grid" id="grid"></div>
<script>
  const T = [
    ["01-new-stock-receipt","01 · New stock","Soft unboxing list, amber price chips"],
    ["02-weekend-deal-price-slash","02 · Weekend deal","Night fur, struck price, tilted photo"],
    ["03-kitten-of-the-week-window-card","03 · Animal of the week","Polaroid + fact pills"],
    ["04-24-7-night-shift","04 · 24/7 night shift","Rounded schedule rows on night"],
    ["05-food-shelf-stack","05 · Food shelf","Shelf rows with photos"],
    ["06-vet-tip-chocolate","06 · Vet tip","Do / do-not panels, red callout"],
    ["07-adoption-day","07 · Adoption day","Photo strip on fur"],
    ["08-delivery-zones","08 · Delivery zones","Zone pills, turf same-day row"],
    ["09-grooming-before-after","09 · Before / after","Tilted duo with +1 WASH badge"],
    ["10-toys-under-thousand","10 · Toys under 1000","Amber feature, three tiles"],
    ["11-customer-story","11 · Customer story","Big quote, round avatar, paw row"],
    ["12-behind-the-counter","12 · Behind the counter","Full bleed photo + night card"],
    ["13-kitten-starter-checklist","13 · Starter checklist","Turf panel, numbered rows"],
    ["14-pharmacy-shelf-guide","14 · Pharmacy guide","Medicine rows, turf chips"],
    ["15-we-are-open","15 · We are open","Night, leaping cat, open badge"],
  ];
  const grid = document.getElementById("grid");
  for (const [file, title, desc] of T) {
    const fig = document.createElement("figure");
    fig.innerHTML = `<div class="frame"><iframe loading="lazy" src="${file}.html"></iframe></div>
      <figcaption><b>${title}</b> · ${desc}</figcaption>`;
    grid.appendChild(fig);
  }
  function fit() {
    document.querySelectorAll(".frame").forEach(f => {
      const s = f.clientWidth / 1080;
      f.querySelector("iframe").style.transform = `scale(${s})`;
    });
  }
  addEventListener("resize", fit); addEventListener("load", fit); fit();
</script>
</body>
</html>
